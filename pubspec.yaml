name: enterprise_mvvm
description: Enterprise Flutter boilerplate with MVVM, Cubit view models, and role-based shells.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  go_router: ^18.1.4
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  json_annotation: ^4.12.0
  cached_network_image: ^4.0.7
  shimmer: ^4.0.0
  flutter_svg: ^2.5.0
  google_nav_bar: ^5.0.7
  url_launcher: ^6.3.2
  intl: ^0.20.3
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  json_serializable: ^6.15.2
  flutter_gen_runner: ^5.15.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter_gen:
  output: lib/gen/
  line_length: 80

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
