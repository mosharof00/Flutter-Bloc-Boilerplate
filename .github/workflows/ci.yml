name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Format
        run: |
          dart format --set-exit-if-changed --output=none \
            $(find lib test tool -name '*.dart' \
              ! -name '*.g.dart' \
              ! -name 'app_localizations*.dart' \
              ! -path 'lib/gen/*')
      - run: flutter analyze
      - run: flutter test --coverage

  android-prod-flavor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build prod flavor (debug, no store signing)
        run: >
          flutter build apk
          --flavor prod
          --debug
          --dart-define-from-file=config/prod.json
